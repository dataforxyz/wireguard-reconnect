name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nftables iproute2 wireguard-tools iw curl python3 util-linux uidmap
      - name: Bash syntax
        run: |
          bash -n install.sh uninstall.sh wg-killswitch wireguard-autostart \
            wireguard-monitor wireguard-portal wireguard-reconnect \
            wireguard-reconnect-sleep wireguard-status tests/*.sh
      - name: ShellCheck
        run: |
          shellcheck install.sh uninstall.sh wg-killswitch wireguard-autostart \
            wireguard-monitor wireguard-portal wireguard-reconnect \
            wireguard-reconnect-sleep wireguard-status tests/*.sh
      - name: Regression suite
        run: make test
      - name: Require kernel namespace integration tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          if ! grep -q "^$(id -un):" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          fi
          output="$(./tests/test-portal-netns.sh)"
          printf '%s\n' "$output"
          grep -Fq 'portal namespace kernel isolation test: OK' <<<"$output"
          output="$(./tests/test-installer-netns.sh)"
          printf '%s\n' "$output"
          grep -Fq 'installer namespace transaction test: OK' <<<"$output"
      - name: Verify systemd units
        run: |
          sudo install -Dm755 ./wg-killswitch /usr/local/bin/wg-killswitch
          sudo install -Dm755 ./wireguard-monitor /usr/local/bin/wireguard-monitor
          sudo install -Dm755 ./wireguard-autostart /usr/local/bin/wireguard-autostart
          sudo install -d -m 0700 /etc/wireguard-reconnect
          printf 'WIREGUARD_INTERFACE=wg0\nWIREGUARD_TAILSCALE_ENABLED=0\n' | \
            sudo tee /etc/wireguard-reconnect/environment >/dev/null
          systemd-analyze verify ./wireguard-killswitch.service ./wireguard-monitor.service ./wireguard-autostart.service
      - name: Whitespace check
        run: git diff --check

  portal-container-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run Docker-backed captive-portal simulation
        run: make portal-container-simulate
